apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ .Release.Name }}-alerts
  labels:
    release: monitoring
spec:
  groups:
    - name: portfolio.rules
      rules:
        - alert: PortfolioServerDown
          expr: up{job="{{ .Release.Name }}-server"} == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "Portfolio Server pod is down"
            description: "The portfolio server target in namespace {{ .Release.Namespace }} has been unreachable for more than 1 minute."

        - alert: HighRequestLatency
          expr: rate(http_request_duration_seconds_sum[5m]) / rate(http_request_duration_seconds_count[5m]) > 0.5
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "High HTTP request latency on Portfolio Server"
            description: "Average request latency is above 0.5 seconds for 2 minutes."
