# Default values. Override per-environment with values-dev.yaml,
# values-staging.yaml, values-prod.yaml (same keys, different numbers).
image:
  repository: ghcr.io/afnankhan55/portfolio-devops
  tag: "19"
  pullPolicy: IfNotPresent 

replicaCount: 3

service:
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  className: nginx
  host: portfolio.local

resources:
  requests:
    cpu: 50m
    memory: 32Mi
  limits:
    cpu: 200m
    memory: 128Mi
