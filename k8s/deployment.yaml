# A Deployment tells Kubernetes: "keep N copies of this container running,
# and if one crashes or the node dies, replace it automatically."
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-server
  namespace: portfolio
  labels:
    app: portfolio-server
spec:
  replicas: 2
  selector:
    matchLabels:
      app: portfolio-server
  template:
    metadata:
      labels:
        app: portfolio-server
    spec:
      containers:
        - name: portfolio-server
          image: localhost:5001/portfolio-server:latest
          ports:
            - containerPort: 8080
          # Readiness: "don't send this pod traffic until it says it's ready."
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          # Liveness: "if this stops responding, kill and restart the pod."
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
