name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: go vet
        run: go vet ./...

      - name: Run tests
        run: go test ./... -v

      - name: Build binary
        run: go build ./...

      - name: Set lowercase repo name
        run: echo "REPO_LC=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build Docker image
        run: |
          docker build \
            --build-arg VERSION=${{ github.run_number }} \
            -t ghcr.io/${{ env.REPO_LC }}:${{ github.run_number }} .

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.ref == 'refs/heads/main'
        run: |
          docker push ghcr.io/${{ env.REPO_LC }}:${{ github.run_number }}

      - name: Update Helm values with new image tag
        if: github.ref == 'refs/heads/main'
        run: |
          sed -i "s/tag: .*/tag: \"${{ github.run_number }}\"/" helm/portfolio/values.yaml
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add helm/portfolio/values.yaml
          git commit -m "ci: deploy image ${{ github.run_number }}" || echo "no changes to commit"
          git push
